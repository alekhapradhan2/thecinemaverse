# Cloudflare Workers configuration for The Cinemaverse
# Using @opennextjs/cloudflare (OpenNext) adapter — recommended by Cloudflare
# https://opennext.js.org/cloudflare

name = "thecinemaverse"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"

# nodejs_compat is REQUIRED for Mongoose / MongoDB Atlas connections
compatibility_flags = ["nodejs_compat"]

assets = { directory = ".open-next/assets", binding = "ASSETS" }

# Hardcode the custom domain so it isn't wiped on deploy
routes = [
  { pattern = "thecinemaverses.in", custom_domain = true }
]

[vars]
NEXT_PUBLIC_SITE_URL = "https://thecinemaverses.in"
NEXT_PUBLIC_SITE_NAME = "The Cinema Verse"

# Required for Next.js ISR and Caching on Cloudflare
[[kv_namespaces]]
binding = "NEXT_CACHE"
id = "PASTE_YOUR_KV_ID_HERE"
